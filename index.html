<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pemantauan Gunungapi Dukono</title>
    <!-- Memuat Chart.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .filter-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            background-color: #fff;
            cursor: pointer;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 450px;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dashboard Aktivitas Kegempaan G. Dukono</h2>
        
        <!-- Bagian Filter Bulanan -->
        <div class="filter-section">
            <label for="filterBulan"><strong>Filter Bulan:</strong></label>
            <select id="filterBulan" onchange="filterDataGrafik()">
                <option value="all">Semua Bulan</option>
                <option value="01">Januari</option>
                <option value="02">Februari</option>
                <option value="03">Maret</option>
                <option value="04">April</option>
                <option value="05">Mei</option>
                <option value="06">Juni</option>
                <option value="07">Juli</option>
                <option value="08">Agustus</option>
                <option value="09">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>
            </select>
        </div>

        <!-- Area Grafik -->
        <div id="loadingText" class="loading">Memuat data dari Google Sheets...</div>
        <div class="chart-container">
            <canvas id="grafikGempa"></canvas>
        </div>
    </div>

    <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypxi6a_rODEwCdIK6gpTjrOckPJFk8QLzMaRMMHWMfBAe6ZBN00d4K_jLxAgPbmJY4/exec";

    let semuaDataGlobal = [];
    let myChart = null;

    // Ambil data dengan penanganan pengalihan (redirect) Google Apps Script
    async function muatData() {
        try {
            const response = await fetch(WEB_APP_URL, {
                method: "GET",
                redirect: "follow"
            });
            
            if (!response.ok) {
                throw new Error("HTTP error! status: " + response.status);
            }

            const data = await response.json();
            semuaDataGlobal = data;
            document.getElementById('loadingText').style.display = 'none';
            tampilkanGrafik(semuaDataGlobal);
        } catch (error) {
            console.error("Gagal memuat data:", error);
            document.getElementById('loadingText').innerText = "Gagal memuat data dari server. Pastikan Web App dipublikasikan ke 'Anyone' (Siapa Saja).";
        }
    }

    // Jalankan pemuatan data
    muatData();

    function filterDataGrafik() {
        let bulanPilihan = document.getElementById('filterBulan').value;
        
        if (bulanPilihan === "all") {
            tampilkanGrafik(semuaDataGlobal);
            return;
        }

        let dataSaringan = semuaDataGlobal.filter(item => {
            let periode = item["PERIODE PENGAMATAN"] || "";
            let bulanData = periode.substring(3, 5); 
            return bulanData === bulanPilihan;
        });

        tampilkanGrafik(dataSaringan);
    }

    function tampilkanGrafik(dataAktif) {
        let labels = dataAktif.map(item => item["PERIODE PENGAMATAN"]);
        let dataLetusan = dataAktif.map(item => parseInt(item["Jumlah Letusan"]) || 0);
        let dataGuguran = dataAktif.map(item => parseInt(item["Jumlah Guguran"]) || 0);
        let dataLF = dataAktif.map(item => parseInt(item["Jumlah LF"]) || 0);

        let ctx = document.getElementById('grafikGempa').getContext('2d');

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Jumlah Letusan',
                        data: dataLetusan,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: false
                    },
                    {
                        label: 'Jumlah Guguran',
                        data: dataGuguran,
                        borderColor: '#f39c12',
                        backgroundColor: 'rgba(243, 156, 18, 0.1)',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: false
                    },
                    {
                        label: 'Jumlah LF',
                        data: dataLF,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0
                        }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
